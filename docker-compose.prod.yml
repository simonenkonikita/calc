# docker-compose.prod.yml

services:
  postgres:
    image: postgres:15-alpine
    container_name: ipoteka_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ipoteka_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: cr.yandex/${YC_REGISTRY_ID}/ipoteka-backend:latest
    container_name: ipoteka_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ipoteka_network

  frontend:
    image: cr.yandex/${YC_REGISTRY_ID}/ipoteka-frontend:latest
    container_name: ipoteka_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - ipoteka_network

volumes:
  postgres_data:

networks:
  ipoteka_network:
    driver: bridge
